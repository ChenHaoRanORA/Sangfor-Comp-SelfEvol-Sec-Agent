<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自进化网络安全智能体 · 实时监测演示</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #0f1a2e;
    --panel2: #12233d;
    --border: #1e3a5f;
    --text: #c9d8ec;
    --muted: #6b83a3;
    --cyan: #22d3ee;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --magenta: #e879f9;
    --font-mono: "Cascadia Code", Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(34,211,238,.06), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(239,68,68,.05), transparent 35%);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,26,46,.6);
  }
  .title { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  .title .shield { color: var(--cyan); margin-right: 8px; }
  .title .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 10px; }
  .hdr-right { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 13px; }
  .badge {
    padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--green); color: var(--green);
    animation: pulse 2s infinite;
  }
  .badge.alarm { border-color: var(--red); color: var(--red); animation: pulse .7s infinite; }
  .badge.end { border-color: var(--muted); color: var(--muted); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    padding: 16px 22px 4px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .v { font-size: 26px; font-weight: 700; font-family: var(--font-mono); color: var(--cyan); }
  .stat .k { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat .v.warn { color: var(--amber); }
  .stat .v.danger { color: var(--red); }

  main {
    display: grid; grid-template-columns: 1fr 380px; gap: 12px;
    padding: 12px 22px 22px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
  }
  .panel h3 {
    font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 1px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .panel h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); }

  #chartWrap { padding: 10px 14px 6px; }
  #chart { width: 100%; height: 150px; display: block; }

  .stream { height: 430px; overflow-y: auto; padding: 6px 0; }
  .stream::-webkit-scrollbar { width: 6px; }
  .stream::-webkit-scrollbar-thumb { background: #24456b; border-radius: 3px; }
  .ev {
    display: flex; gap: 10px; align-items: baseline;
    font-family: var(--font-mono); font-size: 12px;
    padding: 4px 14px; border-left: 3px solid var(--border);
  }
  .ev .tm { color: var(--muted); flex: none; }
  .ev .route { color: #9ab7d6; flex: none; }
  .ev .msg { flex: 1; word-break: break-all; }
  .ev.sev-info    { border-left-color: #2f5f8f; }
  .ev.sev-low     { border-left-color: var(--green); background: rgba(34,197,94,.05); }
  .ev.sev-medium  { border-left-color: var(--amber); background: rgba(245,158,11,.06); }
  .ev.sev-high    { border-left-color: #fb7185; background: rgba(244,63,94,.08); }
  .ev.sev-critical{ border-left-color: var(--red); background: rgba(239,68,68,.12); }

  .alerts { max-height: 300px; overflow-y: auto; }
  .alerts .empty { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
  .alert-card {
    border: 1px solid var(--border); border-left: 4px solid var(--red);
    border-radius: 8px; margin: 10px 12px; padding: 10px 12px;
    background: rgba(239,68,68,.07);
    animation: slideIn .35s ease;
  }
  .alert-card .head { display: flex; justify-content: space-between; align-items: center; }
  .alert-card .title { font-size: 14px; font-weight: 700; color: #fda4af; }
  .alert-card .time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .alert-card .meta { font-size: 12px; color: #9ab7d6; margin: 6px 0; font-family: var(--font-mono); }
  .alert-card .detail { font-size: 12px; color: var(--text); }
  .alert-card .sugg { font-size: 12px; color: #7dd3fc; margin-top: 6px; }
  .alert-card.sev-high .title { color: #fbbf24; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; } }

  #rules { padding: 8px 12px; }
  #rules li {
    list-style: none; font-size: 12px; padding: 6px 0;
    border-bottom: 1px dashed #1a3350; display: flex; gap: 8px;
  }
  #rules li .st { color: var(--green); }
  #rules li .nm { color: var(--text); font-weight: 600; }
  #rules li .ds { color: var(--muted); }

  #alarmBanner {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 99; min-width: 480px; max-width: 640px;
    background: linear-gradient(135deg, rgba(127,29,29,.95), rgba(69,10,10,.95));
    border: 1px solid var(--red); border-radius: 12px;
    padding: 14px 18px; box-shadow: 0 0 40px rgba(239,68,68,.45);
    display: none;
  }
  #alarmBanner.show { display: block; animation: bannerFlash 1s infinite; }
  @keyframes bannerFlash {
    0%,100% { box-shadow: 0 0 30px rgba(239,68,68,.35); }
    50% { box-shadow: 0 0 55px rgba(239,68,68,.75); }
  }
  #alarmBanner .ab-title { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 1px; }
  #alarmBanner .ab-sub { font-size: 12px; color: #fecaca; margin-top: 4px; }
  #alarmBanner .ab-x {
    position: absolute; top: 8px; right: 12px; cursor: pointer; color: #fecaca; font-size: 16px;
  }
  .ab-icon { font-size: 22px; margin-right: 10px; animation: shake .6s infinite; display: inline-block; }
  @keyframes shake { 0%,100%{transform:rotate(-8deg);} 50%{transform:rotate(8deg);} }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="title"><span class="shield">&#128737;</span>自进化网络安全智能体<span class="sub">实时监测演示 · MVP</span></div>
  <div class="hdr-right">
    <div class="badge" id="sysBadge">&#9679; 监测中</div>
    <div id="clock">--:--</div>
  </div>
</header>

<section class="stats">
  <div class="stat"><div class="v" id="stTotal">0</div><div class="k">事件总数</div></div>
  <div class="stat"><div class="v" id="stRate">0.0</div><div class="k">当前速率 (事件/秒)</div></div>
  <div class="stat"><div class="v" id="stAlerts">0</div><div class="k">告警数</div></div>
  <div class="stat"><div class="v" id="stSeverity">--</div><div class="k">最高威胁级别</div></div>
</section>

<main>
  <div class="left">
    <div class="panel">
      <h3><span class="dot"></span>实时流量速率（最近 60s）</h3>
      <div id="chartWrap"><canvas id="chart"></canvas></div>
    </div>
    <div class="panel">
      <h3><span class="dot"></span>实时安全事件流</h3>
      <div class="stream" id="stream"><div class="empty" style="padding:20px;text-align:center;color:var(--muted)">等待数据流入…</div></div>
    </div>
  </div>

  <div class="right">
    <div class="panel">
      <h3><span class="dot" style="background:var(--red)"></span>安全告警</h3>
      <div class="alerts" id="alerts"><div class="empty">暂无告警</div></div>
    </div>
    <div class="panel">
      <h3><span class="dot"></span>检测规则（规则底座）</h3>
      <ul id="rules">
        <li><span class="st">&#10003;</span><span><span class="nm">SSH 暴力破解</span> <span class="ds">15s 内认证失败 ≥ 5 次</span></span></li>
        <li><span class="st">&#10003;</span><span><span class="nm">端口扫描</span> <span class="ds">15s 内扫描端口 ≥ 12 个</span></span></li>
        <li><span class="st">&#10003;</span><span><span class="nm">暴力破解成功</span> <span class="ds">失败多次后登录成功</span></span></li>
        <li><span class="st">&#10003;</span><span><span class="nm">恶意 IP 情报</span> <span class="ds">命中威胁情报黑名单</span></span></li>
        <li><span class="st">&#10003;</span><span><span class="nm">疑似数据外传</span> <span class="ds">15s 内高频大流量外联</span></span></li>
      </ul>
    </div>
  </div>
</main>

<div id="alarmBanner">
  <span class="ab-x" onclick="document.getElementById('alarmBanner').classList.remove('show')">&#10005;</span>
  <div><span class="ab-icon">&#128680;</span><span class="ab-title" id="abTitle">安全告警</span></div>
  <div class="ab-sub" id="abSub"></div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const severityLabel = { info: "低危", low: "低危", medium: "中危", high: "高危", critical: "严重" };

// ---------------- 状态 ----------------
let total = 0, alertCount = 0, maxSev = "info";
let rateTimes = [];                 // 近 5s 事件时间戳，用于计算速率
let chartData = [];                 // {t, v} 速率序列，最多 60 点
let audioCtx = null;

// ---------------- 音频（WebAudio 报警音，需用户交互后可用） ----------------
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
document.addEventListener("click", ensureAudio);
function alarmSound() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [0, 0.22, 0.44].forEach((d, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = i === 2 ? 880 : 660;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.001, t0 + d);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + d + 0.2);
    o.start(t0 + d); o.stop(t0 + d + 0.22);
  });
}

// ---------------- 事件流 ----------------
const streamEl = $("stream");
function addEvent(ev) {
  streamEl.querySelector(".empty")?.remove();
  const row = document.createElement("div");
  row.className = "ev sev-" + ev.severity;
  row.innerHTML =
    '<span class="tm">' + ev.time + "</span>" +
    '<span class="route">' + ev.source_ip + " &rarr; " + ev.target_ip + ":" + ev.target_port + "</span>" +
    '<span class="msg">[' + ev.event_type + "] " + ev.message + "</span>";
  streamEl.prepend(row);
  while (streamEl.children.length > 400) streamEl.lastChild.remove();
  total++;
  const now = Date.now() / 1000;
  rateTimes.push(now);
  rateTimes = rateTimes.filter(t => now - t <= 5);
  $("stTotal").textContent = total;
  $("stRate").textContent = (rateTimes.length / 5).toFixed(1);
}

// ---------------- 告警 ----------------
function addAlert(a) {
  alertCount++;
  const rank = { info: 0, low: 1, medium: 2, high: 3, critical: 4 };
  if (rank[a.severity] >= rank[maxSev]) maxSev = a.severity;
  $("stAlerts").textContent = alertCount;
  $("stSeverity").textContent = severityLabel[maxSev];
  $("stSeverity").className = "v " + (maxSev === "critical" ? "danger" : maxSev === "high" ? "warn" : "");
  $("sysBadge").textContent = "\u26A0 告警中";
  $("sysBadge").className = "badge alarm";

  // 顶部红色报警横幅
  const banner = $("alarmBanner");
  $("abTitle").textContent = "[" + severityLabel[a.severity] + "] " + a.title;
  $("abSub").textContent = a.time + "  " + a.source_ip + " → " + a.target_ip + "  |  " + a.detail;
  banner.classList.remove("show");
  void banner.offsetWidth;   // 重置动画
  banner.classList.add("show");
  alarmSound();

  // 告警卡片
  const box = $("alerts");
  box.querySelector(".empty")?.remove();
  const card = document.createElement("div");
  card.className = "alert-card" + (a.severity === "critical" ? " sev-critical" : a.severity === "high" ? " sev-high" : "");
  card.innerHTML =
    '<div class="head"><span class="title">[' + severityLabel[a.severity] + "] " + a.title + "</span>" +
    '<span class="time">' + a.time + "</span></div>" +
    '<div class="meta">' + a.rule + "  |  " + a.source_ip + " → " + a.target_ip + "</div>" +
    '<div class="detail">' + a.detail + "</div>" +
    '<div class="sugg">&#128161; ' + a.suggestion + "</div>";
  box.prepend(card);
  if (box.children.length > 30) box.lastChild.remove();
}

// ---------------- 图表 ----------------
const canvas = $("chart"), ctx = canvas.getContext("2d");
function drawChart() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const maxV = Math.max(6, ...chartData.map(d => d.v)) * 1.15;
  const n = chartData.length;
  ctx.strokeStyle = "#1e3a5f"; ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = h - (h * i) / 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  if (n < 2) return;
  const step = w / 59;
  const pt = i => {
    const d = chartData[i];
    const x = w - (n - 1 - i) * step;
    const y = h - (d.v / maxV) * (h - 8) - 4;
    return [x, y];
  };
  ctx.beginPath();
  const [x0, y0] = pt(0);
  ctx.moveTo(x0, y0);
  for (let i = 1; i < n; i++) { const [x, y] = pt(i); ctx.lineTo(x, y); }
  ctx.strokeStyle = "#22d3ee"; ctx.lineWidth = 2; ctx.stroke();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "rgba(34,211,238,.25)"); grad.addColorStop(1, "rgba(34,211,238,0)");
  const [lx, ly] = pt(n - 1);
  ctx.lineTo(lx, h - 4); ctx.lineTo(x0, h - 4); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
}
setInterval(() => {
  const now = Date.now() / 1000;
  chartData.push({ t: now, v: rateTimes.filter(t => now - t <= 5).length / 5 });
  if (chartData.length > 60) chartData.shift();
  drawChart();
}, 1000);
window.addEventListener("resize", drawChart);

// ---------------- SSE 订阅 ----------------
const es = new EventSource("/events");
es.onmessage = e => {
  let msg;
  try { msg = JSON.parse(e.data); } catch (err) { return; }
  if (msg.kind === "event") addEvent(msg.data);
  else if (msg.kind === "alert") addAlert(msg.data);
  else if (msg.kind === "finish") finishDemo();
};
es.onerror = () => { /* 自动重连 */ };

function finishDemo() {
  $("sysBadge").textContent = "\u25A0 演示结束";
  $("sysBadge").className = "badge end";
  $("abTitle").textContent = "演示结束";
  $("abSub").textContent = "本轮共监测 " + total + " 条事件，产生 " + alertCount + " 条告警。告警已汇总，可作为经验沉淀到记忆库。";
  $("alarmBanner").classList.add("show");
}

// ---------------- 时钟 ----------------
setInterval(() => {
  const d = new Date();
  $("clock").textContent = d.toTimeString().slice(0, 8);
}, 1000);
</script>
</body>
</html>
